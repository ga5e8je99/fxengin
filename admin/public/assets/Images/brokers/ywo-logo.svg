<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 64" width="250" height="64" fill="none">
  <defs>
    <linearGradient id="ywo-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD000"/>
      <stop offset="50%" stop-color="#FF9D00"/>
      <stop offset="100%" stop-color="#E67E00"/>
    </linearGradient>
    <filter id="ywo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Emblem: Modern faceted 3D cube / chevron dynamic icon -->
  <g filter="url(#ywo-glow)">
    <rect x="6" y="8" width="48" height="48" rx="12" fill="#0E1726" stroke="rgba(255, 170, 0, 0.4)" stroke-width="1.5"/>
    <path d="M18 20 L30 33 L42 20 L36 20 L30 27 L24 20 Z" fill="url(#ywo-gold)"/>
    <path d="M18 31 L30 44 L42 31 L36 31 L30 38 L24 31 Z" fill="#FFFFFF"/>
    <circle cx="30" cy="20" r="3" fill="url(#ywo-gold)"/>
  </g>

  <!-- YWO Letters -->
  <g font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900">
    <!-- Y -->
    <path d="M72 17 L81 32 L81 47 L89 47 L89 32 L98 17 L89 17 L85 25 L81 17 Z" fill="url(#ywo-gold)"/>
    <!-- W -->
    <path d="M102 17 L109 47 L117 47 L122 28 L127 47 L135 47 L142 17 L134 17 L129 37 L124 17 L120 17 L115 37 L110 17 Z" fill="#FFFFFF"/>
    <!-- O -->
    <path d="M157 16 C147 16, 142 23, 142 32 C142 41, 147 48, 157 48 C167 48, 172 41, 172 32 C172 23, 167 16, 157 16 Z M157 24 C162 24, 164 28, 164 32 C164 36, 162 40, 157 40 C152 40, 150 36, 150 32 C150 28, 152 24, 157 24 Z" fill="url(#ywo-gold)"/>
  </g>

  <!-- Tagline / Markets -->
  <text x="182" y="27" fill="#FFA500" font-family="'Montserrat', sans-serif" font-size="11.5" font-weight="900" letter-spacing="2">MARKETS</text>
  <rect x="182" y="32" width="58" height="2" fill="url(#ywo-gold)" rx="1"/>
  <text x="182" y="45" fill="#8E9BB0" font-family="'Montserrat', sans-serif" font-size="8.5" font-weight="700" letter-spacing="1.2">RAW ECN</text>
</svg>
