# ==============================================================================
# FxEngin Sovereign Media Server Configuration (SRS 6.0)
# Ultra-Low Latency WebRTC (<500ms), Low-Latency HLS, RTMP/SRT Ingest, Auto-DVR
# ==============================================================================

listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

# HTTP API Server for WebRTC signaling and management
http_api {
    enabled         on;
    listen          1985;
    crossdomain     on;
}

# HTTP Media Stream Server (HLS, HTTP-FLV)
http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
    crossdomain     on;
}

# WebRTC Server for Ultra-Low Latency Live Forex Scalping Broadcasts
rtc_server {
    enabled         on;
    listen          8000;
    # In docker, candidate must be public IP or domain
    candidate       186.240.145.87;
}

# SRT Server for Lossless Studio Ingestion over noisy networks
srt_server {
    enabled         on;
    listen          10080;
    maxbw           1000000000;
}

# Default Virtual Host Settings
vhost __defaultVhost__ {
    # Low latency mode
    tcp_nodelay     on;
    min_latency     on;

    # WebRTC playback support
    rtc {
        enabled     on;
        bframe      discard;
    }

    # HLS Packaging with 1-second chunks for low delay
    hls {
        enabled         on;
        hls_fragment    1.5;
        hls_window      6.0;
        hls_path        ./objs/nginx/html;
        hls_m3u8_file   [app]/[stream].m3u8;
        hls_ts_file     [app]/[stream]-[seq].ts;
        hls_cleanup     on;
        hls_dispose     10;
        hls_wait_keyframe on;
    }

    # HTTP-FLV support for desktop and web fallback
    http_flv {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }

    # Auto-DVR: Record full broadcast session directly to MP4
    dvr {
        enabled         on;
        dvr_path        ./objs/nginx/html/recordings/[stream].mp4;
        dvr_plan        session;
        dvr_duration    30;
        dvr_wait_keyframe on;
    }

    # Proprietary Security & State Synchronization Webhooks
    # Calls FxEngin NestJS Backend to authenticate stream keys and toggle live status
    http_hooks {
        enabled         on;
        on_publish      http://fxengin-backend:3000/api/live/hooks/on-publish;
        on_unpublish    http://fxengin-backend:3000/api/live/hooks/on-unpublish;
        on_dvr          http://fxengin-backend:3000/api/live/hooks/on-dvr;
    }
}
