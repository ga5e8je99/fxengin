<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 64" width="250" height="64" fill="none">
  <defs>
    <linearGradient id="propxp-cyan-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="60%" stop-color="#7000FF"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="xp-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#B026FF"/>
    </linearGradient>
    <filter id="pxp-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Emblem: Futuristic Shield / Hexagon with XP dynamic energy lines -->
  <g filter="url(#pxp-glow)">
    <rect x="6" y="8" width="48" height="48" rx="12" fill="#0A0E27" stroke="url(#propxp-cyan-purple)" stroke-width="1.8"/>
    <!-- Dynamic Lightning / P & XP glyph -->
    <path d="M19 18 L33 18 C38 18, 41 21, 41 25 C41 29, 38 32, 33 32 L26 32 L26 44 L20 44 L20 18 Z M26 23 L26 27 L32 27 C34 27, 36 26, 36 25 C36 24, 34 23, 32 23 Z" fill="#00F0FF"/>
    <path d="M30 26 L42 44 L35 44 L27 32 Z" fill="#B026FF"/>
  </g>

  <!-- PropXP Wordmark -->
  <g font-family="'Montserrat', sans-serif">
    <!-- "Prop" in bold White -->
    <text x="68" y="42" fill="#FFFFFF" font-size="28" font-weight="900" letter-spacing="0.5">Prop</text>
    
    <!-- "XP" in vibrant Cyan-to-Purple Gradient with tech italic flair -->
    <text x="145" y="42" fill="url(#xp-grad)" font-size="30" font-weight="950" letter-spacing="1">XP</text>
  </g>

  <!-- Tagline / FUNDED TRADER -->
  <text x="69" y="54" fill="#00E5FF" font-family="'Montserrat', sans-serif" font-size="8.5" font-weight="800" letter-spacing="2.5">PROP TRADING FIRM</text>
</svg>
