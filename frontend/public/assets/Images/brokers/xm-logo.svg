<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" width="240" height="64" fill="none">
  <defs>
    <linearGradient id="xm-green-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="xm-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Emblem / Icon: Green rounded square with stylized bull horn cutout -->
  <rect x="6" y="8" width="48" height="48" rx="12" fill="url(#xm-green-grad)" filter="url(#xm-glow)"/>
  
  <!-- Stylized Bull Silhouette / Dynamic Cutout -->
  <path d="M22 38 C22 32, 26 24, 30 20 C34 24, 38 32, 38 38 C35 34, 25 34, 22 38 Z" fill="#FFFFFF"/>
  <path d="M19 23 C22 25, 27 27, 30 31 C33 27, 38 25, 41 23 C37 20, 23 20, 19 23 Z" fill="#FFFFFF" opacity="0.95"/>
  <circle cx="30" cy="35" r="2.5" fill="#047857"/>

  <!-- XM Bold Wordmark -->
  <!-- X -->
  <path d="M72 17 L86 32 L72 47 L82 47 L91 37 L100 47 L110 47 L96 32 L110 17 L100 17 L91 27 L82 17 Z" fill="#FFFFFF"/>
  <!-- M -->
  <path d="M117 17 L117 47 L127 47 L127 28 L137 40 L143 40 L153 28 L153 47 L163 47 L163 17 L150 17 L140 30 L130 17 Z" fill="#FFFFFF"/>

  <!-- Tagline / Global -->
  <text x="174" y="27" fill="#10B981" font-family="'Montserrat', sans-serif" font-size="12" font-weight="900" letter-spacing="2">GLOBAL</text>
  <rect x="174" y="33" width="56" height="2" fill="#10B981" rx="1"/>
  <text x="174" y="45" fill="#8E9BB0" font-family="'Montserrat', sans-serif" font-size="8.5" font-weight="700" letter-spacing="1">REGULATED</text>
</svg>
